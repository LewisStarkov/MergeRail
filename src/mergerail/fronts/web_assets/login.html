<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control room locked · MergeRail</title>
<link rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>{{styles}}</style>
<body>
<main class="login-shell workbench">
  <aside class="sidebar login-queue" inert aria-label="Locked task queue">
    <div class="brand-row">
      <div class="brand">
        <div>
          <h1>MergeRail</h1>
          <div class="brand-caption">Control room locked</div>
        </div>
      </div>
    </div>
    <div class="locked-queue" aria-hidden="true">
      <div class="locked-queue-heading">
        <h2>Tasks</h2>
        <span class="locked-queue-label">LOCKED</span>
      </div>
      <div class="locked-queue-row">
        <strong>Queue unavailable</strong>
        <span>Authenticate to inspect task traffic.</span>
      </div>
    </div>
  </aside>
  <section class="detail login-detail" aria-labelledby="login-title">
    <header class="detail-top">
      <span class="detail-status">
        <i class="bi bi-lock-fill status-icon" aria-hidden="true"></i>
        <span>Control room locked</span>
      </span>
    </header>
    <div class="detail-body login-workspace">
      <div class="login-card">
        <span class="eyebrow">MergeRail / web access</span>
        <h2 id="login-title">Control room locked</h2>
        <p>Enter your MergeRail web credentials.</p>
        {{error}}
        <form method="post" action="/login">
          <label for="username">Username
            <input id="username" name="username" autocomplete="username" required autofocus>
          </label>
          <label for="password">Password
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit" class="primary">
            <span>Unlock</span>
            <i class="bi bi-arrow-right" aria-hidden="true"></i>
          </button>
        </form>
        <p class="login-status">
          <i class="bi bi-shield-lock" aria-hidden="true"></i>
          <span>Credentials are checked locally.</span>
        </p>
      </div>
    </div>
  </section>
</main>
</body>
</html>
