<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MergeRail</title>
<link rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>{{styles}}</style>
<body>
<div class="workbench" data-mobile-view="queue">
  <aside class="sidebar" id="queue-view" aria-label="Task queue">
    <div class="brand-row">
      <div class="brand">
        <div>
          <h1>MergeRail</h1>
          <div class="brand-caption">Control room</div>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button"
              aria-label="Collapse queue rail" aria-expanded="true" aria-controls="sidebar-content">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </button>
    </div>
    <div class="sidebar-content" id="sidebar-content">
      <nav class="sidebar-shortcuts" aria-label="Queue shortcuts">
        <button class="sidebar-shortcut" id="sidebar-new-task" type="button"
                aria-label="New task" title="New task" aria-controls="composer">
          <i class="bi bi-plus-lg" aria-hidden="true"></i>
        </button>
        <button class="sidebar-shortcut" id="sidebar-project-settings" type="button"
                aria-label="Project settings" title="Project settings" aria-controls="setup-panel">
          <i class="bi bi-sliders" aria-hidden="true"></i>
        </button>
      </nav>
      <div id="composer-slot">
        <form id="composer" aria-labelledby="composer-title">
          <label class="sr-only" id="composer-title" for="text">New task</label>
          <textarea id="text" placeholder="Describe a task…" aria-describedby="composer-error"></textarea>
          <div class="row">
            <input type="file" id="file" hidden>
            <button class="attachment-control" id="file-trigger" type="button" aria-controls="file">
              <i class="bi bi-paperclip" aria-hidden="true"></i>
              <span id="file-label">Attach context</span>
            </button>
            <button type="submit" class="primary">
              <i class="bi bi-arrow-up" aria-hidden="true"></i><span>Queue</span>
            </button>
          </div>
          <div class="composer-error" id="composer-error" aria-live="polite"></div>
        </form>
      </div>
      <details class="setup-panel" id="setup-panel">
        <summary>
          <i class="bi bi-sliders" aria-hidden="true"></i>
          Project setup
          <span class="setup-mark" id="setup-mark"></span>
        </summary>
        <form id="setup-form">
          <div class="setup-grid">
            <label class="setup-field">AI agent
              <select id="setup-agent"></select>
            </label>
            <label class="setup-field">Environment
              <select id="setup-environment">
                <option value="local">Local</option><option value="staging">Staging</option>
                <option value="production">Production</option>
              </select>
            </label>
            <label class="setup-field">Current objective
              <textarea id="setup-summary" placeholder="Project and current objective"></textarea>
            </label>
            <label class="setup-field">Actions outside repository
              <select id="setup-external">
                <option value="forbid">Never</option><option value="ask">Ask first</option>
              </select>
            </label>
          </div>
          <button type="submit" class="primary" id="setup-submit">
            <i class="bi bi-check2" aria-hidden="true"></i><span>Save setup</span>
          </button>
        </form>
        <div class="setup-progress" id="setup-progress" aria-live="polite"></div>
      </details>
      <div class="queue-heading">
        <h2>Tasks</h2>
        <span id="summary" aria-live="polite"></span>
      </div>
      <div class="queue-list" id="tasks"></div>
    </div>
  </aside>
  <main class="detail" id="detail" aria-label="Task detail"></main>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Control room views">
    <button type="button" id="mobile-queue" aria-controls="queue-view" aria-current="true">
      <i class="bi bi-list-task" aria-hidden="true"></i><span>Queue</span>
    </button>
    <button type="button" id="mobile-task" aria-controls="detail" aria-disabled="true" aria-current="false">
      <i class="bi bi-file-earmark-text" aria-hidden="true"></i><span>Task</span>
    </button>
    <button type="button" id="mobile-new-task" aria-controls="composer-sheet">
      <i class="bi bi-plus-lg" aria-hidden="true"></i><span>New</span>
    </button>
  </nav>
</div>
<div class="composer-sheet" id="composer-sheet" role="dialog" aria-modal="true"
     aria-labelledby="composer-sheet-title" aria-hidden="true" hidden>
  <button class="composer-backdrop" id="composer-backdrop" type="button" aria-label="Close new task"></button>
  <div class="composer-sheet-panel">
    <div class="composer-sheet-header">
      <h2 id="composer-sheet-title">New task</h2>
      <button class="composer-sheet-close" id="composer-sheet-close" type="button" aria-label="Close new task">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>
    <div class="composer-sheet-content" id="composer-sheet-slot"></div>
  </div>
</div>
<script>
let rendered = "";  // rebuild the list only when it changed, so a button
                    // cannot move out from under a click mid-poll
const expandedStreams = new Set();
let selectedTaskId = null;
let taskSnapshot = [];
const previousTaskStates = new Map();
let taskStateHistoryReady = false;
let setupSignature = "";
const threadCache = new Map();
const threadDrafts = new Map();
const threadFiles = new Map();
const workbench = document.querySelector(".workbench");
const queueView = document.getElementById("queue-view");
const detailView = document.getElementById("detail");
const mobileQueue = document.getElementById("mobile-queue");
const mobileTask = document.getElementById("mobile-task");
const mobileNewTask = document.getElementById("mobile-new-task");
const sidebarToggle = document.getElementById("sidebar-toggle");
const composer = document.getElementById("composer");
const composerSlot = document.getElementById("composer-slot");
const composerSheet = document.getElementById("composer-sheet");
const composerSheetSlot = document.getElementById("composer-sheet-slot");
const composerSheetClose = document.getElementById("composer-sheet-close");
const composerSheetPanel = composerSheet.querySelector(".composer-sheet-panel");
const composerBackdrop = document.getElementById("composer-backdrop");
let composerReturnFocus = null;
let mobileView = "queue";
let composerSheetState = "closed";
let composerTransitionToken = 0;
let composerCloseTimer = 0;
let composerCloseReturnQueue = false;
let composerSubmitting = false;
const statusIcons = {
  new: "circle", running: "arrow-repeat", review: "search", approved: "check2-circle",
  delivering: "git", done: "check2", failed: "x-lg", blocked: "exclamation-triangle",
  cancelling: "stop-circle", closed: "archive",
};
async function refresh() {
  let raw;
  try {
    raw = await (await fetch("/api/tasks")).text();
  } catch { return; }  // the runner is restarting; the next poll will find it
  renderPayload(raw);
}

function renderPayload(raw) {
  const payload = JSON.parse(raw);
  const signature = JSON.stringify(payload);
  if (signature === rendered) return;
  rendered = signature;
  const tasks = payload.tasks || [];
  const selectedBefore = selectedTaskId;
  const taskMotion = new Map(tasks.map((task) => {
    const previous = previousTaskStates.get(task.id);
    const motion = !taskStateHistoryReady ? ""
      : !previous ? "new" : previous.status !== task.status ? "status" : "";
    return [task.id, motion];
  }));
  renderSetup(payload.setup || {});
  taskSnapshot = tasks;
  if (!tasks.some((task) => task.id === selectedTaskId))
    selectedTaskId = (tasks.find((task) => task.open) || tasks[0] || {}).id || null;
  const open = tasks.filter((t) => t.open).length;
  document.getElementById("summary").textContent =
    tasks.length ? `${open} open · ${tasks.length} total` : "";
  const root = document.getElementById("tasks");
  root.replaceChildren(...(tasks.length ? tasks.map((task) => card(task, taskMotion.get(task.id))) : [empty()]));
  const selected = tasks.find((task) => task.id === selectedTaskId);
  if (!selected && mobileView === "detail") mobileView = "queue";
  setMobileView(mobileView);
  const selectedChanged = selectedBefore !== null && selectedBefore !== selectedTaskId;
  renderDetail(selected, selectedChanged);
  if (selected) syncThread(selected);
  previousTaskStates.clear();
  tasks.forEach((task) => previousTaskStates.set(task.id, {status: task.status}));
  taskStateHistoryReady = true;
}

function renderSetup(setup) {
  const panel = document.getElementById("setup-panel");
  const progress = setup.progress || {};
  const values = setup.values || {};
  const signature = JSON.stringify({agents: setup.agents || {}, values});
  if (signature !== setupSignature) {
    setupSignature = signature;
    const agents = setup.agents || {};
    fillAgentSelect("setup-agent", agents, values.agent || "auto");
    document.getElementById("setup-environment").value = values.environment || "local";
    document.getElementById("setup-summary").value = values.summary || "";
    document.getElementById("setup-external").value = values.external_actions || "forbid";
  }
  if (!setup.initialized || ["running", "failed"].includes(progress.status)) panel.open = true;
  document.getElementById("setup-mark").textContent =
    progress.status === "running" ? "working…" : setup.initialized ? "ready" : "required";
  const status = document.getElementById("setup-progress");
  status.dataset.status = progress.status || "idle";
  status.replaceChildren();
  if (progress.message) status.append(line("div", "", progress.message));
  if ((progress.history || []).length > 1) {
    const history = document.createElement("ol");
    history.className = "setup-history";
    history.append(...progress.history.map((item) =>
      line("li", "", `${item.stage}: ${item.message}`)));
    status.append(history);
  }
  document.getElementById("setup-submit").disabled =
    progress.status === "running" || setup.busy || setup.available === false;
}

function fillAgentSelect(id, agents, selected) {
  const select = document.getElementById(id);
  const options = [];
  options.push({value: "auto", label: "Auto (first available)"});
  for (const [name, info] of Object.entries(agents)) {
    options.push({
      value: name,
      label: `${name}${info.available ? "" : ` — unavailable${info.reason ? `: ${info.reason}` : ""}`}`,
    });
  }
  select.replaceChildren(...options.map((item) => {
    const option = document.createElement("option");
    option.value = item.value;
    option.textContent = item.label;
    option.disabled = item.value !== "auto" && !agents[item.value]?.available;
    return option;
  }));
  select.value = options.some((item) => item.value === selected) ? selected : "auto";
}

function empty() {
  const el = document.createElement("div");
  el.className = "empty";
  el.append(
    icon("inbox", "empty-icon"),
    line("div", "", "Nothing queued. Write something above."),
  );
  return el;
}

function card(t, motion = "") {
  const el = document.createElement("button");
  el.type = "button";
  el.className = `task${t.id === selectedTaskId ? " selected" : ""}`;
  if (motion) el.dataset.motion = motion;
  el.dataset.id = String(t.id);
  el.dataset.status = t.status;
  el.title = `#${t.id} · ${t.status} · ${t.text || "attachment only"}`;
  el.setAttribute("aria-label", el.title);
  el.setAttribute("aria-current", String(t.id === selectedTaskId));
  el.onclick = () => selectTask(t.id);
  const head = document.createElement("span");
  head.className = "task-head";
  head.append(
    icon(statusIcons[t.status] || "circle", "status-icon"),
    line("span", "id", `#${t.id}`),
    line("span", "text", t.text || "(attachment only)"),
  );
  el.append(head);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.append(line("span", "", t.status));
  if (t.file) meta.append(metaItem("paperclip", "attachment"));
  if (t.branch) meta.append(metaItem("git", t.branch));
  if (t.attempts > 1) meta.append(metaItem("arrow-repeat", `attempt ${t.attempts}`));
  if (t.message_count) meta.append(metaItem("chat-left-text", `${t.message_count} messages`));
  if (t.pending_message_count) {
    const pending = metaItem("hourglass-split", `${t.pending_message_count} pending`);
    pending.classList.add("pending-badge");
    meta.append(pending);
  }
  el.append(meta);
  return el;
}

function metaItem(name, text) {
  const item = document.createElement("span");
  item.append(icon(name), line("span", "", text));
  return item;
}

function selectTask(id) {
  const selectedBefore = selectedTaskId;
  selectedTaskId = id;
  document.querySelectorAll(".queue-list .task").forEach((task) => {
    const selected = Number(task.dataset.id) === id;
    task.classList.toggle("selected", selected);
    task.setAttribute("aria-current", String(selected));
  });
  const selected = taskSnapshot.find((task) => task.id === id);
  if (selected) setMobileView("detail");
  renderDetail(selected, Boolean(selected && selectedBefore !== id));
  if (selected) syncThread(selected);
}

function renderDetail(t, animateSelection = false) {
  const root = document.getElementById("detail");
  const top = document.createElement("header");
  top.className = "detail-top";
  if (t && animateSelection) top.dataset.motion = "selection";
  const status = document.createElement("span");
  status.className = "detail-status";
  status.append(
    icon(statusIcons[t?.status] || "circle", "status-icon"),
    line("span", "", t ? `Task #${t.id} · ${t.status}` : "No task selected"),
  );
  top.append(status);
  if (t) top.append(actions(t));
  if (!t) {
    const blank = line("div", "detail-empty", "Select a task from the queue.");
    root.replaceChildren(top, blank);
    return;
  }
  const body = document.createElement("div");
  body.className = "detail-body";
  body.append(line("h2", "detail-title", t.text || "Attachment-only task"));
  const facts = document.createElement("div");
  facts.className = "facts";
  facts.append(
    fact("Source", t.source || "web", "inbox"),
    fact("Branch", t.branch || "Not created", "git"),
    fact("Attempt", String(t.attempts || 1), "arrow-repeat"),
  );
  if (t.cost_usd) facts.append(fact("Cost", `$${t.cost_usd.toFixed(2)}`, "currency-dollar"));
  body.append(facts);
  if (t.delivery) body.append(delivery(t.delivery));
  body.append(thread(t));
  if (t.note) body.append(section("Result", t.note, "check2-square"));
  if (t.url && /^https?:\/\//.test(t.url)) {
    const link = document.createElement("a");
    link.href = t.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.append(icon("box-arrow-up-right"), line("span", "", "Open pull request"));
    const wrap = document.createElement("div");
    wrap.className = "detail-section";
    wrap.append(link);
    body.append(wrap);
  }
  root.replaceChildren(top, body);
}

function fact(label, value, iconName) {
  const item = document.createElement("div");
  item.className = "fact";
  const caption = document.createElement("div");
  caption.className = "fact-label";
  caption.append(icon(iconName), line("span", "", label));
  item.append(caption, line("div", "fact-value", value));
  return item;
}

function section(title, text, iconName) {
  const wrap = document.createElement("section");
  wrap.className = `detail-section ${title.toLowerCase()}`;
  const heading = document.createElement("h3");
  heading.append(icon(iconName), line("span", "", title));
  wrap.append(heading, line("div", "detail-note", text));
  return wrap;
}

function delivery(value) {
  const wrap = section("Delivery", value.status || "pending", "git");
  const note = wrap.querySelector(".detail-note");
  if (value.status === "blocked") note.classList.add("blocked");
  if (value.error) note.textContent += `
${value.error}`;
  return wrap;
}

function cachedThread(taskId) {
  if (!threadCache.has(taskId)) {
    threadCache.set(taskId, {
      messages: [], loaded: false, loading: false, sending: false,
      total: 0, signature: "", error: "",
    });
  }
  return threadCache.get(taskId);
}

function threadSignature(value) {
  return [
    Number(value.message_count || 0),
    Number(value.pending_message_count || 0),
    Number(value.message_revision || 0),
    value.last_message_at || "",
  ].join(":");
}

function syncThread(task) {
  const state = cachedThread(task.id);
  const signature = threadSignature(task);
  if (!state.loaded || state.signature !== signature) loadThread(task.id, true);
}

async function loadThread(taskId, reset = false) {
  const state = cachedThread(taskId);
  if (state.loading) return;
  state.loading = true;
  state.error = "";
  if (reset) {
    state.messages = [];
    state.loaded = false;
  }
  if (selectedTaskId === taskId)
    renderDetail(taskSnapshot.find((task) => task.id === taskId));
  const after = reset || !state.messages.length ? 0 : state.messages[state.messages.length - 1].id;
  try {
    const response = await fetch(`/api/tasks/${taskId}/messages?after=${after}&limit=50`);
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || "Could not load discussion");
    const incoming = Array.isArray(payload.messages) ? payload.messages : [];
    const combined = reset ? incoming : [...state.messages, ...incoming];
    state.messages = Array.from(new Map(combined.map((message) => [message.id, message])).values())
      .sort((left, right) => left.id - right.id);
    state.total = Number(payload.message_count || 0);
    state.signature = threadSignature(payload);
    state.loaded = true;
  } catch (error) {
    state.error = error instanceof Error ? error.message : "Could not load discussion";
  } finally {
    state.loading = false;
    if (selectedTaskId === taskId)
      renderDetail(taskSnapshot.find((task) => task.id === taskId));
  }
}

function thread(task) {
  const state = cachedThread(task.id);
  const wrap = document.createElement("section");
  wrap.className = "detail-section thread";
  const heading = document.createElement("h3");
  heading.className = "thread-heading";
  heading.append(
    icon("chat-left-text"),
    line("span", "", "Discussion"),
    line("span", "thread-count", `${state.total || task.message_count || 0} messages`),
  );
  wrap.append(heading);

  const list = document.createElement("div");
  list.className = "thread-list";
  list.setAttribute("aria-live", "polite");
  list.append(messageBubble({
    role: "user",
    author: task.author || task.source || "user",
    text: task.text || "Attachment-only task",
    file: task.file,
    status: "original task",
    created_at: task.created_at,
  }));
  list.append(...state.messages.map(messageBubble));
  if (task.live && Object.keys(task.live.roles || {}).length)
    list.append(agentActivity(task.id, task.live));
  if (!state.loaded && state.loading)
    list.append(line("div", "thread-empty is-loading", "Loading discussion…"));
  wrap.append(list);

  if (state.loaded && state.messages.length < state.total) {
    const more = document.createElement("button");
    more.type = "button";
    more.className = "thread-more";
    more.disabled = state.loading;
    more.append(icon("arrow-down-circle"), line("span", "", "Load more messages"));
    more.onclick = () => loadThread(task.id);
    wrap.append(more);
  }
  if (state.error) wrap.append(line("div", "thread-error", state.error));
  wrap.append(threadComposer(task.id, state));
  return wrap;
}

function messageBubble(message) {
  const role = ["user", "assistant", "system"].includes(message.role)
    ? message.role : "system";
  const box = document.createElement("article");
  box.className = `thread-message ${role}${message.status === "failed" ? " failed" : ""}`;
  const head = document.createElement("div");
  head.className = "thread-message-head";
  head.append(
    icon(role === "user" ? "person" : role === "assistant" ? "cpu" : "info-circle"),
    line("span", "", message.author ? `${message.author} · ${role}` : role),
  );
  if (message.mode) head.append(line("span", "", message.mode));
  const timestamp = formatTimestamp(message.created_at);
  if (timestamp) head.append(line("time", "", timestamp));
  if (message.status) head.append(line("span", "message-status", message.status));
  box.append(head, line("div", "thread-message-text", message.text || ""));
  if (message.file) {
    const name = String(message.file).split(/[\\/]/).pop() || "attachment";
    const attachment = document.createElement("div");
    attachment.className = "thread-attachment";
    attachment.append(icon("paperclip"), line("span", "", name));
    box.append(attachment);
  }
  return box;
}

function formatTimestamp(value) {
  if (!value) return "";
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? String(value) : parsed.toLocaleString();
}

function submitOnEnter(event, form) {
  if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
  event.preventDefault();
  form.requestSubmit();
}

function threadComposer(taskId, state) {
  const form = document.createElement("form");
  form.className = `thread-composer${state.sending ? " is-sending" : ""}`;
  const input = document.createElement("textarea");
  input.placeholder = "Add context or a follow-up…";
  input.value = threadDrafts.get(taskId) || "";
  input.disabled = state.sending;
  input.oninput = () => threadDrafts.set(taskId, input.value);
  input.addEventListener("keydown", (event) => submitOnEnter(event, form));
  form.append(input);

  const row = document.createElement("div");
  row.className = "row";
  const picker = document.createElement("input");
  picker.type = "file";
  picker.id = `thread-file-${taskId}`;
  picker.hidden = true;
  picker.onchange = () => {
    const file = picker.files[0];
    if (file) threadFiles.set(taskId, file); else threadFiles.delete(taskId);
    attachment.querySelector("span").textContent = file?.name || "Attach context";
  };
  const attachment = document.createElement("button");
  attachment.type = "button";
  attachment.className = "attachment-control";
  attachment.setAttribute("aria-controls", picker.id);
  attachment.onclick = () => picker.click();
  attachment.append(
    icon("paperclip"),
    line("span", "", threadFiles.get(taskId)?.name || "Attach context"),
  );
  const comment = document.createElement("button");
  comment.type = "submit";
  comment.dataset.mode = "comment";
  comment.className = "comment";
  comment.disabled = state.sending;
  comment.append(icon("chat"), line("span", "", "Comment"));
  const send = document.createElement("button");
  send.type = "submit";
  send.dataset.mode = "instruction";
  send.className = "primary";
  send.disabled = state.sending;
  send.setAttribute("aria-busy", String(state.sending));
  send.append(icon("arrow-up"), line("span", "", state.sending ? "Sending…" : "Send to agent"));
  row.append(picker, attachment, comment, send);
  form.append(row);
  form.onsubmit = (event) => {
    event.preventDefault();
    const mode = event.submitter?.dataset.mode || "instruction";
    submitThreadMessage(taskId, mode);
  };
  return form;
}

async function submitThreadMessage(taskId, mode) {
  const state = cachedThread(taskId);
  const text = (threadDrafts.get(taskId) || "").trim();
  if (!text || state.sending) return;
  state.sending = true;
  state.error = "";
  renderDetail(taskSnapshot.find((task) => task.id === taskId));
  const payload = {
    text,
    mode,
    idempotency_key: globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`,
  };
  const file = threadFiles.get(taskId);
  try {
    if (file) {
      const data = await readFile(file);
      payload.file = {name: file.name, data};
    }
    const response = await fetch(`/api/tasks/${taskId}/messages`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload),
    });
    const answer = await response.json();
    if (!response.ok) throw new Error(answer.error || "Could not send message");
    threadDrafts.delete(taskId);
    threadFiles.delete(taskId);
    await loadThread(taskId, true);
    await refresh();
  } catch (error) {
    state.error = error instanceof Error ? error.message : "Could not send message";
  } finally {
    state.sending = false;
    if (selectedTaskId === taskId)
      renderDetail(taskSnapshot.find((task) => task.id === taskId));
  }
}

async function readFile(file) {
  const value = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
  return String(value).split(",", 2)[1];
}

function agentActivity(taskId, trace) {
  const message = document.createElement("article");
  message.className = "thread-message system activity";
  const box = document.createElement("details");
  box.className = "live";
  box.open = expandedStreams.has(taskId);
  box.ontoggle = () => box.open ? expandedStreams.add(taskId) : expandedStreams.delete(taskId);
  const states = Object.entries(trace.roles || {})
    .map(([name, state]) => `${name}: ${state.status || "live"}`)
    .join(" · ");
  const summary = document.createElement("summary");
  const ring = document.createElement("span");
  ring.className = "live-status-ring is-live";
  ring.setAttribute("aria-hidden", "true");
  summary.append(
    ring,
    icon("terminal"),
    line(
      "span",
      "",
      `Agent activity · ${trace.stage || "working"}${states ? ` · ${states}` : ""}`,
    ),
    icon("chevron-right", "activity-chevron"),
  );
  box.append(summary);
  const body = document.createElement("div");
  body.className = "live-body";
  body.setAttribute("aria-live", "polite");
  for (const [name, state] of Object.entries(trace.roles || {})) {
    const role = document.createElement("div");
    role.className = "live-role";
    const head = document.createElement("div");
    head.className = `live-head ${state.status || ""}`;
    head.append(icon("cpu"), line("span", "", `${name} · ${state.status || "live"}`));
    role.append(head);
    if (state.text) {
      const output = line("pre", "stream-output", state.text);
      role.append(output);
      requestAnimationFrame(() => { output.scrollTop = output.scrollHeight; });
    }
    const tools = (state.tools || []).slice(-6);
    if (tools.length) {
      const list = document.createElement("ul");
      list.className = "tool-list";
      list.append(...tools.map((tool) => {
        const item = document.createElement("li");
        item.append(icon("wrench-adjustable-circle"), line("span", "", tool));
        return item;
      }));
      role.append(list);
    }
    if ((state.history || []).length) {
      const earlier = document.createElement("details");
      earlier.className = "history";
      const label = document.createElement("summary");
      label.append(
        icon("clock-history"),
        line("span", "", `${state.history.length} earlier response(s)`),
      );
      earlier.append(label, ...state.history.map((text) => line("pre", "stream-output", text)));
      role.append(earlier);
    }
    body.append(role);
  }
  box.append(body);
  message.append(box);
  return message;
}

function actions(t) {
  const box = document.createElement("span");
  box.className = "detail-actions";
  if (!t.open && t.delivery && t.delivery.status === "blocked")
    box.append(act(t.id, "retry-delivery", "retry delivery"));
  if (!t.open) box.append(act(t.id, "retry-task", "retry task"));
  if (["running", "review"].includes(t.status))
    box.append(act(t.id, "cancel", "cancel"));
  if (t.open && t.status === "new") box.append(act(t.id, "close", "close"));
  if (!["running", "review", "approved", "delivering", "cancelling"].includes(t.status))
    box.append(act(t.id, "delete", "delete"));
  return box;
}

function act(id, verb, label) {
  const el = document.createElement("button");
  el.type = "button";
  el.dataset.verb = verb;
  el.setAttribute("aria-label", label);
  const icons = {
    "retry-delivery": "git", "retry-task": "arrow-clockwise",
    cancel: "stop-circle", close: "x-lg", delete: "trash3",
  };
  el.append(icon(icons[verb] || "circle"), line("span", "", label));
  el.onclick = async () => {
    await fetch(`/api/tasks/${id}/${verb}`, {method: "POST"});
    refresh();
  };
  return el;
}

function line(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  el.textContent = text;
  return el;
}

function icon(name, cls = "") {
  const el = document.createElement("i");
  el.className = `bi bi-${name}${cls ? ` ${cls}` : ""}`;
  el.setAttribute("aria-hidden", "true");
  return el;
}

composer.onsubmit = async (event) => {
  event.preventDefault();
  if (composerSubmitting) return;
  const text = document.getElementById("text");
  const picker = document.getElementById("file");
  const error = document.getElementById("composer-error");
  const submit = composer.querySelector('button[type="submit"]');
  const payload = {text: text.value};
  error.textContent = "";
  composerSubmitting = true;
  submit.disabled = true;
  composer.classList.add("is-sending");
  try {
    const file = picker.files[0];
    if (file) {
      const data = await readFile(file);
      payload.file = {name: file.name, data};
    }
    const sent = await fetch("/api/tasks", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload),
    });
    const answer = await sent.json();
    if (!sent.ok) throw new Error(answer.error || "Could not queue task");
    text.value = "";
    picker.value = "";
    document.getElementById("file-label").textContent = "Attach context";
    closeComposerSheet({returnQueue: true});
    await refresh();
  } catch (submissionError) {
    error.textContent = submissionError instanceof Error
      ? submissionError.message : "Could not queue task";
  } finally {
    composerSubmitting = false;
    submit.disabled = false;
    composer.classList.remove("is-sending");
  }
};

document.getElementById("setup-form").onsubmit = async (event) => {
  event.preventDefault();
  const payload = {
    agent: document.getElementById("setup-agent").value,
    environment: document.getElementById("setup-environment").value,
    summary: document.getElementById("setup-summary").value,
    external_actions: document.getElementById("setup-external").value,
  };
  await fetch("/api/setup", {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload),
  });
  refresh();
};

document.getElementById("file").onchange = (event) => {
  document.getElementById("file-label").textContent =
    event.target.files[0]?.name || "Attach context";
};
document.getElementById("file-trigger").onclick = () =>
  document.getElementById("file").click();

document.getElementById("text").addEventListener("keydown", (event) => {
  submitOnEnter(event, composer);
});

function isMobileViewport() {
  return window.matchMedia("(max-width: 760px)").matches;
}

function setMobileView(view) {
  const next = view === "detail" && selectedTaskId !== null ? "detail" : "queue";
  mobileView = next;
  workbench.dataset.mobileView = next;
  const mobile = isMobileViewport();
  queueView.hidden = mobile && next !== "queue";
  detailView.hidden = mobile && next !== "detail";
  queueView.inert = mobile && next !== "queue";
  detailView.inert = mobile && next !== "detail";
  mobileQueue.setAttribute("aria-current", String(next === "queue"));
  mobileTask.setAttribute("aria-current", String(next === "detail"));
  mobileTask.setAttribute("aria-disabled", String(selectedTaskId === null));
}

function composerFocusable() {
  return [...composerSheet.querySelectorAll(
    "button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled])",
  )].filter((element) => !element.hidden && element.tabIndex >= 0);
}

function composerMotionDisabled() {
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function finalizeComposerClose(token = composerTransitionToken) {
  if (token !== composerTransitionToken || composerSheetState === "closed") return;
  window.clearTimeout(composerCloseTimer);
  composerCloseTimer = 0;
  composerSheetState = "closed";
  composerSheet.classList.remove("is-open", "is-closing");
  composerSlot.append(composer);
  composerSheet.hidden = true;
  composerSheet.setAttribute("aria-hidden", "true");
  workbench.inert = false;
  if (composerCloseReturnQueue) setMobileView("queue");
  composerCloseReturnQueue = false;
  const target = composerReturnFocus;
  composerReturnFocus = null;
  if (target && typeof target.focus === "function") target.focus();
}

function openComposerSheet() {
  if (!isMobileViewport()) {
    setSidebarCollapsed(false);
    document.getElementById("text").focus();
    return;
  }
  if (composerSheetState === "closed") composerReturnFocus = document.activeElement;
  const token = ++composerTransitionToken;
  window.clearTimeout(composerCloseTimer);
  composerCloseTimer = 0;
  composerSheetSlot.append(composer);
  composerSheet.hidden = false;
  composerSheet.setAttribute("aria-hidden", "false");
  composerSheetState = "open";
  composerSheet.classList.remove("is-open", "is-closing");
  workbench.inert = true;
  document.getElementById("composer-error").textContent = "";
  requestAnimationFrame(() => {
    if (token === composerTransitionToken && composerSheetState === "open") {
      composerSheet.classList.add("is-open");
      document.getElementById("text").focus();
    }
  });
}

function closeComposerSheet({returnQueue = false} = {}) {
  if (composerSheetState === "closed" || composerSheet.hidden) {
    if (returnQueue) setMobileView("queue");
    return;
  }
  const token = ++composerTransitionToken;
  window.clearTimeout(composerCloseTimer);
  composerCloseReturnQueue = returnQueue;
  const immediate = !isMobileViewport() || composerMotionDisabled();
  if (immediate) {
    finalizeComposerClose(token);
    return;
  }
  composerSheetState = "closing";
  composerSheet.setAttribute("aria-hidden", "false");
  composerSheet.classList.remove("is-open");
  composerSheet.classList.add("is-closing");
  workbench.inert = true;
  composerCloseTimer = window.setTimeout(() => finalizeComposerClose(token), 340);
}

function setSidebarCollapsed(collapsed) {
  const value = isMobileViewport() ? false : collapsed;
  workbench.classList.toggle("sidebar-collapsed", value);
  sidebarToggle.setAttribute("aria-expanded", String(!value));
  sidebarToggle.setAttribute("aria-label", value ? "Expand queue rail" : "Collapse queue rail");
  sidebarToggle.title = value ? "Expand queue rail" : "Collapse queue rail";
}

sidebarToggle.onclick = () =>
  setSidebarCollapsed(!workbench.classList.contains("sidebar-collapsed"));

document.getElementById("sidebar-new-task").onclick = () => {
  setSidebarCollapsed(false);
  openComposerSheet();
};

document.getElementById("sidebar-project-settings").onclick = () => {
  setSidebarCollapsed(false);
  setMobileView("queue");
  document.getElementById("setup-panel").open = true;
  document.getElementById("setup-agent").focus();
};

mobileQueue.onclick = () => setMobileView("queue");
mobileTask.onclick = () => {
  if (selectedTaskId !== null) setMobileView("detail");
};
mobileNewTask.onclick = openComposerSheet;
composerSheetClose.onclick = () => closeComposerSheet();
composerBackdrop.onclick = () => closeComposerSheet();
composerSheetPanel.addEventListener("transitionend", (event) => {
  if (event.target === composerSheetPanel && event.propertyName === "transform" && composerSheetState === "closing")
    finalizeComposerClose(composerTransitionToken);
});
composerSheet.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    event.preventDefault();
    closeComposerSheet();
    return;
  }
  if (event.key !== "Tab") return;
  const focusable = composerFocusable();
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});
window.addEventListener("resize", () => {
  if (!isMobileViewport() && !composerSheet.hidden) {
    closeComposerSheet();
    document.getElementById("text").focus();
  }
  setMobileView(mobileView);
});
setMobileView("queue");

refresh();
const events = new EventSource("/api/events");
events.onmessage = (event) => renderPayload(event.data);
setInterval(refresh, 15000);  // fallback for browsers or proxies that interrupt SSE
</script>
</body>
</html>
