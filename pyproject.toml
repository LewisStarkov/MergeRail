[project]
name = "mergerail"
version = "0.1.4"
description = "Queue coding tasks across agent CLIs, review the result, and deliver it safely."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agent", "claude", "codex", "opencode", "code-review", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately empty. This thing gets installed into other people's projects
# with `uvx`, and a dependency of ours is a version conflict of theirs.
dependencies = []

[project.scripts]
mergerail = "mergerail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mergerail"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/docs",
  "/mergerail.toml",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/uv.lock",
  "/webui",
]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "pytest-cov>=6", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=mergerail"

[tool.coverage.run]
branch = true
source = ["mergerail"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
skip_covered = true
